[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postflowx-companion"
version = "0.1.0"
description = "Native companion scaffold for PostFlowX IMF playback, proxy, and QC."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "PostFlowX" }
]

[project.scripts]
postflowx-companion = "postflowx_companion.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

