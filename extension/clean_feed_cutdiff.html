<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clean Feed</title>
  <style>
    :root{ color-scheme: dark; }
    html,body{ margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
    .wrap{ position:fixed; inset:0; background:#000; overflow:hidden; }
    #cfCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; background:#000; }
    #cfOld,#cfNew{ position:absolute; width:1px; height:1px; left:-9999px; top:-9999px; opacity:0; pointer-events:none; }
    #cfWmText{
      position:fixed; left:50%; top:15%; transform:translate(-50%, -50%); z-index:7;
      pointer-events:none; user-select:none; white-space:nowrap; max-width:96vw;
      overflow:hidden; text-overflow:ellipsis;
      font: 700 clamp(14px, 2.2vw, 32px) ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      letter-spacing:.3px; color: rgba(255,255,255,0.50);
      text-shadow: 0 1px 2px rgba(0,0,0,0.55), 0 0 14px rgba(0,0,0,0.35);
    }
    #cfWmText.is-hidden{ display:none; }
    .wipeLine{ position:absolute; top:0; bottom:0; width:2px; left:50%; transform:translateX(-1px);
      background: rgba(255,255,255,.70);
      box-shadow: 0 0 0 1px rgba(0,0,0,.35),0 0 16px rgba(255,255,255,.16);
      opacity:0; pointer-events:none; z-index:6;
    }
    .wipeLine.is-on{ opacity:1; }
    .hud{ position:fixed; left:12px; top:10px; right:12px; display:flex; align-items:center; justify-content:space-between;
      font: 12px/1.2 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: rgba(255,255,255,0.85); text-shadow: 0 1px 2px rgba(0,0,0,0.6); pointer-events:none; z-index:8; }
    .hud .left{ display:flex; gap:10px; align-items:center; min-width:0; }
    .pill{ padding:4px 8px; border-radius:999px; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px); max-width:55vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hint{ position:fixed; left:12px; bottom:10px; font: 12px/1.2 ui-sans-serif, system-ui; color: rgba(255,255,255,0.6);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6); pointer-events:none; z-index:8; }
    .hint kbd{ font: 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding:2px 6px; border-radius:6px; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); }
    .empty{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color: rgba(255,255,255,0.35); font:14px/1.4 ui-sans-serif, system-ui; z-index:5; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="cfCanvas"></canvas>
    <video id="cfOld" playsinline preload="auto" muted></video>
    <video id="cfNew" playsinline preload="auto"></video>
    <div id="cfWmText" class="is-hidden" aria-hidden="true"></div>
    <div class="wipeLine" id="cfWipeLine" aria-hidden="true"></div>
  </div>
  <div class="hud" aria-hidden="true">
    <div class="left">
      <div class="pill" id="cfLabel">Clean Feed</div>
      <div class="pill" id="cfTc">00:00:00:00</div>
    </div>
    <div class="pill" id="cfAudio">MUTED</div>
  </div>
  <div class="hint" aria-hidden="true"><span><kbd>F</kbd> Fullscreen&nbsp;&nbsp;<kbd>M</kbd> Mute</span></div>
  <div class="empty" id="cfEmpty">Waiting for compare feed…</div>
  <script src="clean_feed_cutdiff.js"></script>
</body>
</html>
